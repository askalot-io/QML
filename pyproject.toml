[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "askalot_qml"
version = "1.29.0"
description = "QML processing and analysis engine for Askalot platform"
authors = [
    {name = "Askalot IO", email = "info@askalot.io"}
]
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = "==3.12.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Framework :: Flask",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["qml", "questionnaire", "z3", "constraint-solving", "survey", "analysis"]
dependencies = [
    "Flask>=3.1.0",
    "PyYAML>=6.0.0",
    "jsonschema>=4.0.0",
    "z3-solver==4.15.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.1.0",
    "coverage>=7.0.0",
    "mypy>=1.0.0",
    "types-PyYAML",
    "types-jsonschema",
]

[project.urls]
Homepage = "https://github.com/askalot-io/QML"
Repository = "https://github.com/askalot-io/QML"
Issues = "https://github.com/askalot-io/QML/issues"

[tool.hatch.build.targets.wheel]
packages = ["askalot_qml"]
artifacts = ["askalot_qml/schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "z3: Z3 constraint solver tests",
    "flow: FlowProcessor navigation tests",
    "topology: Dependency graph and topological sorting tests",
    "cycle_detection: Cycle detection tests",
    "diagram: Mermaid diagram generation tests",
    "dependency_graph: Dependency graph construction tests",
    "transitive: Transitive dependency resolution tests",
    "models: Model and data structure tests",
]

[tool.coverage.run]
source = ["askalot_qml"]
omit = ["tests/*"]
